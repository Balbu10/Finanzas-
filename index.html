<style>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const DEF=()=>({rate:7500,ents:[{id:'e1',n:'Mango',t:'Financiera'},{id:'e2',n:'Ueno',t:'Banco'}],
 cats:['Comida','Transporte','Hogar','Servicios','Salud','Educación','Ocio','Deudas','Otros'],
 icats:['Salario','Extra','Otros'],tx:[],debts:[],bud:{},sav:[],goal:0,owed:[],tcpay:[],tc0:{PYG:0,USD:0},tcd:0,tcl:0});
let S=DEF(),tab='res',month=today().slice(0,7),db=null,doc=null,st='Cargando…';
const TABS=[['res','<span class=ic>🏠</span>Resumen'],['mov','<span class=ic>📝</span>Registro'],['deu','<span class=ic>🏦</span>Deudas'],['aho','<span class=ic>🐷</span>Ahorro'],['pre','<span class=ic>🎯</span>Límites'],['ent','<span class=ic>🏛️</span>Entidades']];
const toGs=(a,c)=>c==='USD'?a*S.rate:a;
const fmt=(n,c)=>c==='USD'?(n<0?'-':'')+'US$ '+Math.abs(n).toLocaleString('es-PY',{minimumFractionDigits:2,maximumFractionDigits:2}):Math.round(n).toLocaleString('es-PY')+' Gs.';
const num=(v,c)=>{v=String(v||'').trim();if(c==='USD'){v=v.replace(/\s/g,'');if(v.includes(',')){v=v.replace(/\./g,'').replace(',','.')}else if(!/^\d*\.\d{1,2}$/.test(v)){v=v.replace(/\./g,'')}return parseFloat(v)||0}return parseInt(v.replace(/\D/g,''))||0};
const ent=id=>(S.ents.find(e=>e.id===id)||{n:'—'}).n;
const paid=d=>(d.prev||0)+d.pagos.reduce((a,p)=>a+p.a,0);
const cp=d=>(d.np0||0)+d.pagos.length;
let tm;function save(){try{localStorage.setItem('fin_v1',JSON.stringify(S))}catch(e){}
 clearTimeout(tm);tm=setTimeout(async()=>{if(doc){try{await doc.set({json:JSON.stringify(S)});st='Guardado en tu cuenta';try{localStorage.removeItem('fin_dirty')}catch(x){}}catch(e){st='Guardado solo en este celular';try{localStorage.setItem('fin_dirty','1')}catch(x){}}}else{st='Guardado solo en este celular';try{localStorage.setItem('fin_dirty','1')}catch(x){}};const s=$('#st');if(s)s.textContent=st},400)}
async function init(){
 try{const l=localStorage.getItem('fin_v1');if(l)S=Object.assign(DEF(),JSON.parse(l))}catch(e){}
 R();
 try{if(window.claude&&claude.use){const u=await claude.use('user'),d=await claude.use('db');
  if(u&&d){const id=await u.id();doc=d.collection('data/users/'+id).doc('state');const s=await doc.get();
   const dirty=localStorage.getItem('fin_dirty');if(s.exists&&!dirty){const j=JSON.parse(s.data().json);S=Object.assign(DEF(),j)}else{await doc.set({json:JSON.stringify(S)});localStorage.removeItem('fin_dirty')}st='Sincronizado con tu cuenta'}}}catch(e){doc=null}
 if(!doc)st='Guardado solo en este celular';R()}
window.alert=m=>{let b=$('#toast');if(!b){b=document.createElement('div');b.id='toast';b.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:9;text-align:center';document.body.appendChild(b)}b.textContent=m;b.style.display='block';clearTimeout(b.t);b.t=setTimeout(()=>b.style.display='none',3500)};
let edD='',pend='';
function editDebt(id){edD=id;R();scrollTo(0,0)}
function cancelEd(){edD='';R()}
function vEdit(){const d=S.debts.find(x=>x.id===edD);if(!d)return '';return `<div class='card'><h2>Editar deuda: ${esc(ent(d.e))}</h2><div class='mu'>Descripción</div><input id='e-n' value='${esc(d.n||'').replace(/'/g,'&#39;')}'><div class='mu'>Monto total del préstamo</div><input id='e-tot' inputmode='decimal' value='${d.total}'>${d.fx?`<div class='mu'>Cuota fija</div><input id='e-cu' inputmode='decimal' value='${d.cuota}'>`:''}<div class='mu'>Día de vencimiento (1-31)</div><input id='e-due' inputmode='numeric' value='${d.due||''}'><div class='mu'>Cantidad total de cuotas</div><input id='e-nc' inputmode='numeric' value='${d.nc||''}'><div class='mu'>Cuotas ya pagadas antes de usar la app</div><input id='e-np' inputmode='numeric' value='${d.np0||0}'>${d.fx?'':`<div class='mu'>Monto ya pagado antes de usar la app</div><input id='e-pv' inputmode='decimal' value='${d.prev||0}'>`}<button onclick='saveDebt()'>Guardar cambios</button><button class='g' onclick='cancelEd()'>Cancelar</button></div>`}
function saveDebt(){const d=S.debts.find(x=>x.id===edD);if(!d)return;const c=d.c,tot=num($('#e-tot').value,c);if(!tot)return alert('Ingresá el monto total');let cu=d.cuota;if(d.fx){cu=num($('#e-cu').value,c);if(!cu)return alert('Ingresá el monto de la cuota')}d.n=$('#e-n').value;d.total=tot;d.nc=parseInt($('#e-nc').value)||0;d.due=Math.min(parseInt($('#e-due').value)||0,31);d.np0=parseInt($('#e-np').value)||0;if(d.fx){d.cuota=cu;d.prev=d.np0*cu}else d.prev=num($('#e-pv').value,c);edD='';save();R()}
const PM={EF:'Efectivo',TR:'Transferencia',TC:'TC',TD:'TD'};
const PMO=`<option value='EF'>Efectivo</option><option value='TR'>Transferencia</option><option value='TC'>Tarjeta de crédito</option><option value='TD'>Tarjeta de débito</option>`;
const tcpaid=c=>S.tcpay.filter(p=>p.c===c).reduce((a,p)=>a+p.a,0);
const tcbal=c=>(S.tc0[c]||0)+S.tx.filter(t=>t.c===c&&t.ty==='g'&&t.pm==='TC').reduce((a,t)=>a+t.a,0)-tcpaid(c);
const cobr=o=>o.cobros.reduce((a,p)=>a+p.a,0);
let dsub='deu';
function setDs(k){dsub=k;R()}
const segs=()=>`<div class='row' style='margin-bottom:10px'>${[['deu','Mis deudas'],['tc','Mi TC'],['ow','Me deben']].map(([k,l])=>`<button class='${dsub===k?'':'g'}' onclick=setDs(this.dataset.k) data-k=${k}>${l}</button>`).join('')}</div>`;
function nextDue(day,pd){const t=new Date(),y=t.getFullYear(),m=t.getMonth(),t0=new Date(y,m,t.getDate()),mm=pd?m+1:m,dt=new Date(y,mm,Math.min(day,new Date(y,mm+1,0).getDate()));return {days:Math.round((dt-t0)/864e5),date:new Date(dt-dt.getTimezoneOffset()*6e4).toISOString().slice(0,10)}}
function upcoming(){const ms=today().slice(0,7),r=[];S.debts.forEach(d=>{if(d.due&&paid(d)<d.total){const x=nextDue(d.due,d.pagos.some(p=>p.d.startsWith(ms)));if(x.days<=10)r.push({n:'Cuota '+ent(d.e)+(d.n?' · '+d.n:''),...x})}});if(S.tcd&&tcbal('PYG')+tcbal('USD')>0){const x=nextDue(S.tcd,S.tcpay.some(p=>p.d.startsWith(ms)));if(x.days<=10)r.push({n:'Tarjeta de crédito',...x})}return r.sort((a,b)=>a.days-b.days)}
function resExtra(){const tg=tcbal('PYG'),tu=tcbal('USD'),ow=S.owed.reduce((a,o)=>a+toGs(o.total-cobr(o),o.c),0),v=upcoming();return `<div class='row'><div class='card'><div class='mu'>Deuda en TC</div><b class='ng'>${fmt(tg,'PYG')}</b>${tu?`<br><b class='ng'>${fmt(tu,'USD')}</b>`:''}${S.tcl?`<div class='mu'>Disponible: ${fmt(S.tcl-tcUsed(),'PYG')}</div>`:''}</div><div class='card'><div class='mu'>Me deben</div><b class='ok'>${fmt(ow,'PYG')}</b></div></div>${v.length?`<div class='card'><h2>Próximos vencimientos</h2>${v.map(x=>`<div class='li'><div>${esc(x.n)}</div><div class='${x.days<=3?'ng':''}'>${x.days<0?'Vencida':x.days===0?'Hoy':'En '+x.days+' días'} · ${x.date.slice(8)}/${x.date.slice(5,7)}</div></div>`).join('')}</div>`:''}`}
function setTc0(el){S.tc0[el.dataset.c]=num(el.value,el.dataset.c);save();R()}
function setTcd(v){S.tcd=Math.min(parseInt(v)||0,31);save();R()}
function addTcPay(){const c=$('#k-cur').value,a=num($('#k-amt').value,c);if(!a)return alert('Ingresá el monto pagado');S.tcpay.push({id:uid(),a,c,d:$('#k-date').value||today()});save();R()}
function delTcPay(id){S.tcpay=S.tcpay.filter(p=>p.id!==id);save();R()}
function vTC(){const l=S.tcpay.slice().sort((a,b)=>b.d.localeCompare(a.d)).slice(0,20),cs=S.tx.filter(t=>t.ty==='g'&&t.pm==='TC').length;return `<div class='card hero'><div class='mu'>Deuda en tarjeta de crédito</div><div class='big'>${fmt(tcbal('PYG'),'PYG')}</div><div class='big' style='font-size:18px'>${fmt(tcbal('USD'),'USD')}</div>${tcLine()}<div class='mu'>${cs} compras con TC registradas${S.tcd?' · vence el día '+S.tcd:''}</div></div><div class='card'><h2>Registrar pago de la tarjeta</h2><div class='row'><input id='k-amt' inputmode='decimal' placeholder='Monto pagado'><select id='k-cur'><option value='PYG'>Gs.</option><option value='USD'>USD</option></select></div><input id='k-date' type='date' value='${today()}'><button onclick='addTcPay()'>Registrar pago</button></div><div class='card'><h2>Ajustes de la tarjeta</h2><div class='mu'>Deuda que ya tenías antes de usar la app</div><div class='row'><input inputmode='numeric' placeholder='Gs.' value='${S.tc0.PYG||''}' data-c=PYG onchange=setTc0(this)><input inputmode='decimal' placeholder='USD' value='${S.tc0.USD||''}' data-c=USD onchange=setTc0(this)></div><div class='mu'>Línea de crédito de la tarjeta (en Gs.)</div><input inputmode='numeric' placeholder='Ej: 1.000.000' value='${S.tcl||''}' onchange=setTcl(this)><div class='mu'>Día de vencimiento de la tarjeta (1-31)</div><input inputmode='numeric' value='${S.tcd||''}' onchange=setTcd(this.value)></div><div class='card'><h2>Pagos de la tarjeta</h2>${l.length?l.map(p=>`<div class='li'><div><b>Pago</b><div class='mu'>${p.d}</div></div><div style='text-align:right'><b class='ok'>${fmt(p.a,p.c)}</b><br><button class=x onclick=delTcPay(this.dataset.i) data-i=${p.id}>Borrar</button></div></div>`).join(''):`<div class=mu>Sin pagos registrados.</div>`}</div><div class='mu'>Las compras con TC se anotan en Registro eligiendo la forma de pago Tarjeta de crédito. Suman a la deuda de la tarjeta y no bajan tu saldo hasta que registrás el pago de la tarjeta.</div>`}
function addOw(){const c=$('#o-cur').value,a=num($('#o-tot').value,c);if(!a)return alert('Ingresá el monto prestado');S.owed.push({id:uid(),e:$('#o-ent').value,n:$('#o-n').value,total:a,c,cobros:[]});save();R()}
function cobrar(id){const o=S.owed.find(x=>x.id===id),a=num($('#q-'+id).value,o.c);if(!a)return alert('Ingresá el monto cobrado');o.cobros.push({id:uid(),a,d:today()});save();R()}
function undoCobro(id){S.owed.find(x=>x.id===id).cobros.pop();save();R()}
function delOw(id){if(pend!==id){pend=id;R();setTimeout(()=>{if(pend===id){pend='';R()}},4000);return}pend='';S.owed=S.owed.filter(o=>o.id!==id);save();R()}
function vOw(){return `<div class='card'><h2>Alguien me debe</h2><select id='o-ent'>${S.ents.map(e=>`<option value='${e.id}'>${esc(e.n)} (${esc(e.t)})</option>`).join('')}</select><input id='o-n' placeholder='Descripción (opcional)'><div class='row'><input id='o-tot' inputmode='decimal' placeholder='Monto prestado'><select id='o-cur'><option value='PYG'>Gs.</option><option value='USD'>USD</option></select></div><button onclick='addOw()'>Agregar</button><div class='mu'>Para agregar a una persona, usá la pestaña Entidades (tipo Persona).</div></div>`+(S.owed.map(o=>{const p=cobr(o),r=Math.max(o.total-p,0);return `<div class='card'><div class='row sp'><b>${esc(ent(o.e))}${o.n?' · '+esc(o.n):''}</b><button class=x onclick=delOw(this.dataset.i) data-i=${o.id}>${pend===o.id?'¿Seguro? Tocá otra vez':'Borrar'}</button></div><div class='big ${r?'ok':''}'>${r?fmt(r,o.c):'¡Cobrado!'}</div><div class='bar'><i style='width:${Math.min(p/o.total*100,100)}%'></i></div><div class='mu'>Cobrado ${fmt(p,o.c)} de ${fmt(o.total,o.c)}</div>${r?`<div class='row'><input id='q-${o.id}' inputmode='decimal' placeholder='Monto cobrado'><button onclick=cobrar(this.dataset.i) data-i=${o.id}>Registrar cobro</button></div>`:''}${o.cobros.length?`<div class='mu'>Último cobro: ${fmt(o.cobros[o.cobros.length-1].a,o.c)} <button class=x onclick=undoCobro(this.dataset.i) data-i=${o.id}>Deshacer</button></div>`:''}</div>`}).join('')||`<div class=mu>Nadie te debe por ahora.</div>`)}
let adv='';
function advCard(){if(!window.claude)return '';return `<div class='card'><h2>🤖 Asesor de deudas</h2>${adv?`<div style='white-space:pre-wrap'>${esc(adv)}</div>`:`<div class=mu>Claude analiza tus deudas, ingresos y gastos y te arma un plan para salir de deudas.</div>`}<button onclick='asesor()'>${adv?'Actualizar plan':'Armar mi plan'}</button></div>`}
async function asesor(){let sm=null;try{sm=window.claude&&await claude.use('sample')}catch(e){}
if(!sm){adv='El asesor no está disponible en esta vista.';R();return}
adv='Analizando tus finanzas…';R();
const m=mtx(),D={moneda_base:'Gs.',tipo_cambio_Gs_por_USD:S.rate,mes:month,ingresos_mes_Gs:Math.round(sum(m,t=>t.ty==='i')),gastos_mes_Gs:Math.round(sum(m,t=>t.ty==='g')),ocio_mes_Gs:Math.round(sum(m,t=>t.ty==='g'&&t.cat==='Ocio')),ahorro_mes_Gs:Math.round(svMonth()),ahorro_total_Gs:Math.round(svTot()),deuda_TC:{Gs:tcbal('PYG'),USD:tcbal('USD'),vence_dia:S.tcd||null},deudas:S.debts.map(d=>({entidad:ent(d.e),detalle:d.n,moneda:d.c,total:d.total,saldo:Math.max(d.total-paid(d),0),cuota_fija:d.fx?d.cuota:'variable',cuotas_total:d.nc||null,cuotas_pagadas:cp(d),vence_dia:d.due||null})),me_deben:S.owed.map(o=>({persona:ent(o.e),moneda:o.c,saldo:Math.max(o.total-cobr(o),0)}))};
try{const r=await sm('Sos un asesor de finanzas personales para alguien en Paraguay (usá voseo). Con estos datos, armá un plan claro para salir de deudas. Incluí: 1) en qué orden pagar y por qué (TC, deudas con vencimiento cercano y las de mayor costo primero; si faltan las tasas de interés, decilo), 2) cuánto destinar por mes según su margen, 3) dos o tres recortes concretos (por ejemplo ocio), 4) qué hacer con lo que le deben. Máximo 220 palabras, texto plano sin markdown ni asteriscos, y no inventes datos que no estén. No sos asesor financiero matriculado: cerrá con una frase breve que lo aclare. Datos: '+JSON.stringify(D),{cache:false});adv=r.text}catch(e){adv='No se pudo generar el plan ('+((e&&e.code)||'error')+').'}R()}
const SKIP=['d-nc','d-np','d-due','e-nc','e-np','e-due'];
const isNum=el=>el.tagName==='INPUT'&&el.getAttribute('inputmode')&&!SKIP.includes(el.id)&&!/setTcd/.test(el.getAttribute('onchange')||'');
function curOf(el){if(el.dataset.c)return el.dataset.c;const id=el.id||'',M={'t-amt':'t-cur','d-tot':'d-cur','d-cu':'d-cur','d-pv':'d-cur','s-amt':'s-cur','k-amt':'k-cur','o-tot':'o-cur'};if(M[id]){const s=$('#'+M[id]);return s?s.value:'PYG'}if(id.startsWith('p-')){const d=S.debts.find(x=>x.id===id.slice(2));return d?d.c:'PYG'}if(id.startsWith('q-')){const o=S.owed.find(x=>x.id===id.slice(2));return o?o.c:'PYG'}if(id.startsWith('e-')){const d=S.debts.find(x=>x.id===edD);return d?d.c:'PYG'}return 'PYG'}
function maskVal(v,c,ch){const th=s=>s.replace(/\B(?=(\d{3})+(?!\d))/g,'.');if(c==='USD'){if(ch==='.')v=v.replace(/\.(?=[^.]*$)/,',');const s=v.replace(/[^\d,]/g,''),i=s.indexOf(','),ip=(i<0?s:s.slice(0,i)).replace(/^0+(?=\d)/,''),dp=i<0?'':s.slice(i+1).replace(/,/g,'').slice(0,2);return th(ip)+(i<0?'':','+dp)}return th(v.replace(/\D/g,'').replace(/^0+(?=\d)/,''))}
function fmtAll(){document.querySelectorAll('input').forEach(el=>{if(!isNum(el)||!el.value)return;const c=curOf(el),n=num(el.value,c);el.value=c==='USD'?maskVal(String(n).replace('.',','),'USD'):maskVal(String(n),'PYG')})}

 <div class="mu">Pagado ${fmt(p,d.c)} de ${fmt(d.total,d.c)} · ${d.fx?'Cuota fija '+fmt(d.cuota,d.c):'Cuota variable'}</div>${d.due?`<div class='mu'>Vence el día ${d.due} de cada mes</div>`:''}${d.nc?`<div class='mu'>${rest?'Te toca la cuota '+(cp(d)+1)+' de '+d.nc:'Cuotas completas'} · pagadas ${cp(d)} · restan ${Math.max(d.nc-cp(d),0)}</div>`:d.fx&&rest?`<div class='mu'>~${Math.ceil(rest/d.cuota)} cuotas restantes</div>`:''}
 ${rest?`<select id="m-${d.id}">${PMO}</select><div class="row"><input id="p-${d.id}" inputmode="decimal" placeholder="Monto pagado" value="${d.fx?d.cuota:''}"><button onclick="pay('${d.id}')">Registrar pago</button></div>`:''}
 ${d.pagos.length?`<div class="mu">Último pago: ${fmt(d.pagos[d.pagos.length-1].a,d.c)} (${d.pagos[d.pagos.length-1].d}) <button class="x" onclick="undoPay('${d.id}')">Deshacer</button></div>`:''}</div>`}).join('')||'<div class="mu">Aún no cargaste deudas.</div>')}
const COL=['#38bdf8','#34d399','#fbbf24','#fb7185','#a78bfa','#f472b6','#a3e635','#22d3ee','#94a3b8'];
const svMonth=()=>S.sav.filter(s=>s.d.startsWith(month)).reduce((a,s)=>a+toGs(s.a,s.c),0);
const svTot=()=>S.sav.reduce((a,s)=>a+toGs(s.a,s.c),0);
function donut(cats){const e=Object.entries(cats).sort((a,b)=>b[1]-a[1]),t=e.reduce((a,x)=>a+x[1],0);if(!t)return `<div class=mu>Sin gastos este mes.</div>`;let acc=0;const g=e.map(([k,v],i)=>{const s=acc/t*100;acc+=v;return COL[i%COL.length]+' '+s+'% '+(acc/t*100)+'%'}).join(',');return `<div class='row' style='align-items:center'><div style='flex:0 0 110px;height:110px;border-radius:50%;background:conic-gradient(${g});-webkit-mask:radial-gradient(circle,transparent 30px,#000 31px);mask:radial-gradient(circle,transparent 30px,#000 31px)'></div><div>${e.map(([k,v],i)=>`<div class='mu'><span style='display:inline-block;width:9px;height:9px;border-radius:2px;background:${COL[i%COL.length]}'></span> ${esc(k)} ${Math.round(v/t*100)}%</div>`).join('')}</div></div>`}
function months6(){const r=[],[y,m]=month.split('-').map(Number);for(let i=5;i>=0;i--){const d=new Date(y,m-1-i,1);r.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))}return r}
function bars(){const D=months6().map(k=>{const x=S.tx.filter(t=>t.d.startsWith(k));return {k,i:sum(x,t=>t.ty==='i'),g:sum(x,t=>t.ty==='g'),s:S.sav.filter(s=>s.d.startsWith(k)).reduce((a,s)=>a+toGs(s.a,s.c),0)}}),mx=Math.max(1,...D.flatMap(d=>[d.i,d.g,d.s]));return `<div style='display:flex;gap:6px;align-items:flex-end'>${D.map(d=>`<div style='flex:1;text-align:center'><div style='display:flex;gap:2px;align-items:flex-end;height:100px;justify-content:center'>${[[d.i,'var(--ok)'],[d.g,'var(--ng)'],[d.s,'var(--ac)']].map(([v,c])=>`<div style='width:30%;height:${v/mx*100}%;min-height:${v>0?2:0}px;background:${c};border-radius:3px 3px 0 0'></div>`).join('')}</div><div class='mu' style='font-size:10px'>${d.k.slice(5)}</div></div>`).join('')}</div><div class='mu'>Verde: ingresos · Rojo: gastos · Turquesa: ahorro (Gs. aprox.)</div>`}
function addSav(){const c=$('#s-cur').value,a=num($('#s-amt').value,c);if(!a)return alert('Ingresá un monto');S.sav.push({id:uid(),a:$('#s-ty').value==='r'?-a:a,c,d:$('#s-date').value||today(),n:$('#s-note').value});save();R()}
function delSav(id){S.sav=S.sav.filter(s=>s.id!==id);save();R()}
function setGoal(v){S.goal=num(v,'PYG');save();R()}
function vAho(){const tc=c=>S.sav.filter(s=>s.c===c).reduce((a,s)=>a+s.a,0),tg=tc('PYG'),tu=tc('USD'),tot=svTot(),gl=S.goal,p=gl?Math.min(Math.max(tot/gl*100,0),100):0,l=S.sav.slice().sort((a,b)=>b.d.localeCompare(a.d)).slice(0,30);return `<div class='card'><div class='mu'>Total ahorrado</div><div class='big'>${fmt(tg,'PYG')}</div><div class='big' style='font-size:18px'>${fmt(tu,'USD')}</div><div class='mu'>Aprox. ${fmt(tot,'PYG')} · este mes ${fmt(svMonth(),'PYG')}</div></div><div class='card'><h2>Meta de ahorro (en Gs.)</h2><input inputmode='numeric' placeholder='Sin meta' value='${gl||''}' onchange='setGoal(this.value)'>${gl?`<div class='bar'><i style='width:${p}%'></i></div><div class='mu'>${Math.round(p)}% de ${fmt(gl,'PYG')} · faltan ${fmt(Math.max(gl-tot,0),'PYG')}</div>`:''}</div><div class='card'><h2>Ahorro del mes</h2><select id='s-ty'><option value='d'>Depósito (ahorré)</option><option value='r'>Retiro (saqué)</option></select><div class='row'><input id='s-amt' inputmode='decimal' placeholder='Monto'><select id='s-cur'><option value='PYG'>Gs.</option><option value='USD'>USD</option></select></div><input id='s-date' type='date' value='${today()}'><input id='s-note' placeholder='Nota (opcional)'><button onclick='addSav()'>Guardar</button></div><div class='card'>${l.length?l.map(s=>`<div class='li'><div><b>${s.a<0?'Retiro':'Depósito'}</b><div class='mu'>${s.d}${s.n?' · '+esc(s.n):''}</div></div><div style='text-align:right'><b class='${s.a<0?'ng':'ok'}'>${fmt(s.a,s.c)}</b><br><button class=x onclick=delSav('${s.id}')>Borrar</button></div></div>`).join(''):`<div class=mu>Todavía no registraste ahorros.</div>`}</div>`}
function setBud(c,v){S.bud[c]=num(v,'PYG');save();R()}
function addCat(){const n=$('#c-n').value.trim();if(n&&!S.cats.includes(n)){S.cats.push(n);save();R()}}
function vPre(){return vPre2()}
function vPreOld(){
 return `<div class="card"><h2>Presupuesto mensual (en Gs.)</h2><div class="mu">Los gastos en USD se convierten al tipo de cambio.</div>`+
 S.cats.map(c=>`<div class="li"><div style="flex:1">${esc(c)}<div class="mu">Gastado en ${mLabel()}: ${fmt(spentCat(c),'PYG')}</div></div><input style="flex:1;text-align:right" inputmode="numeric" placeholder="Sin límite" value="${S.bud[c]||''}" onchange="setBud('${esc(c).replace(/'/g,'')}',this.value)"></div>`).join('')+`</div>
 <div class="card"><h2>Nueva categoría de gasto</h2><div class="row"><input id="c-n" placeholder="Nombre"><button onclick="addCat()">Agregar</button></div></div>`}
function addEnt(){const n=$('#n-n').value.trim();if(!n)return;S.ents.push({id:uid(),n,t:$('#n-t').value});save();R()}
function delEnt(id){if(S.debts.some(d=>d.e===id)||S.owed.some(o=>o.e===id)||S.tx.some(t=>t.e===id))return alert('Esta entidad tiene deudas o inversiones asociadas.');S.ents=S.ents.filter(e=>e.id!==id);save();R()}
function vEnt(){
 return `<div class="card"><h2>Agregar entidad</h2><input id="n-n" placeholder="Nombre (banco, financiera, cooperativa…)">
 <select id="n-t"><option>Banco</option><option>Financiera</option><option>Cooperativa</option><option>Persona</option><option>Otra</option></select>
 <button onclick="addEnt()">Agregar</button></div>
 <div class="card">${S.ents.map(e=>`<div class="li"><div><b>${esc(e.n)}</b><div class="mu">${esc(e.t)}</div></div><button class="x" onclick="delEnt('${e.id}')">Borrar</button></div>`).join('')}</div>`}
init();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
